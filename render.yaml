# Blueprint do Render (https://render.com/docs/blueprint-spec).
# Passo a passo completo do deploy em DEPLOY.md.
services:
  - type: web
    name: iwori-agenda
    runtime: docker
    plan: free
    # Escolha a região mais próxima do banco no Aiven; não dá para mudar depois.
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      # ── Aplicação ───────────────────────────────────────────────
      - key: APP_NAME
        value: Agenda Iwori
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY # base64:... (php artisan key:generate --show)
        sync: false
      - key: APP_URL # ex.: https://iwori-agenda.onrender.com
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      # O plano Free não tem pre-deploy, worker nem cron: migrations,
      # fila e agendador rodam no próprio contêiner (docker/entrypoint.sh).
      - key: RUN_MIGRATIONS
        value: "1"
      - key: RUN_WORKERS
        value: "1"

      # ── Banco: Aiven for MySQL (plano Free) ─────────────────────
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        value: defaultdb
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      # Secret file "aiven-ca.pem" adicionado no painel do Render.
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/secrets/aiven-ca.pem

      # ── Sessão, cache e fila ────────────────────────────────────
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_ENCRYPT
        value: "true"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: FILESYSTEM_DISK
        value: local

      # ── Arquivos: Cloudflare R2 (o disco do Free some a cada reinício) ─
      # Fotos de perfil e comprovantes vão para um bucket privado.
      - key: UPLOADS_DISK
        value: r2
      - key: R2_BUCKET
        value: iwori-uploads
      - key: R2_ENDPOINT # https://<ACCOUNT_ID>.r2.cloudflarestorage.com
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

      # ── E-mail: Brevo na porta 2525 (o Free bloqueia 25/465/587) ─
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "2525"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Agenda Iwori

  # ── Ambiente de demonstração para clientes ────────────────────────
  # Mesmo código, banco PRÓPRIO e DEMO_MODE=true: login com um clique na conta
  # fictícia, dados recriados todo dia e a cada vez que o serviço acorda,
  # nenhum e-mail/WhatsApp enviado. Passo a passo em DEPLOY.md, seção 8.
  - type: web
    name: iwori-agenda-demo
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: APP_NAME
        value: Agenda Iwori
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY # gere uma chave PRÓPRIA, diferente da produção
        sync: false
      - key: APP_URL # ex.: https://iwori-agenda-demo.onrender.com
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: RUN_MIGRATIONS
        value: "1"
      - key: RUN_WORKERS
        value: "1"

      # Banco separado da produção: database e usuário próprios no Aiven,
      # com acesso só ao database da demo (nunca o avnadmin).
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        value: iwori_demo
      - key: DB_USERNAME
        value: iwori_demo
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/secrets/aiven-ca.pem

      - key: SESSION_DRIVER
        value: database
      - key: SESSION_ENCRYPT
        value: "true"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: FILESYSTEM_DISK
        value: local

      # Sem SMTP, WhatsApp ou Google: o DEMO_MODE já força o e-mail para o log.
      - key: MAIL_MAILER
        value: log
